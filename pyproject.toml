[project]
name = "vgo-k3-ai-product-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.0",
    "pypdf>=6.14.2",
    "requests>=2.32.0",
    "jinja2>=3.1.6",
    "openai>=2.50.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "crawl4ai>=0.9.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: gọi model thật qua OpenRouter, cần OPENAI_API. Chạy bằng `pytest -m live`.",
]
